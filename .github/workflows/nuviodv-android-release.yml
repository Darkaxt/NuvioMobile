name: Publish NuvioDV Android Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact synchronized commit to build and publish
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuviodv-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish ARM64 APK
    runs-on: ubuntu-latest
    env:
      RUNTIME_PROPERTIES_BASE64: ${{ secrets.NUVIODV_RUNTIME_PROPERTIES_BASE64 }}
      KEYSTORE_BASE64: ${{ secrets.NUVIODV_RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.NUVIODV_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NUVIODV_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NUVIODV_RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read and validate release metadata
        id: release
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          version="$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*(.+)$/\1/p' iosApp/Configuration/Version.xcconfig)"
          version_code="$(sed -nE 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([0-9]+)$/\1/p' iosApp/Configuration/Version.xcconfig)"
          tag="v${version}"

          if [[ -n "${REQUESTED_SOURCE_SHA}" ]]; then
            [[ "${source_sha}" == "${REQUESTED_SOURCE_SHA}" ]]
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nuviodv\.[0-9]+$ ]]
          [[ "${version_code}" =~ ^[0-9]+$ ]]
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in RUNTIME_PROPERTIES_BASE64 KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required GitHub Actions secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Test authenticated release configuration
        shell: bash
        run: bash .github/scripts/test-configure-nuviodv-release.sh

      - name: Configure authenticated release signing
        shell: bash
        run: bash .github/scripts/configure-nuviodv-release.sh

      - name: Build signed release APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace

      - name: Verify generated authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          supabase_config='composeApp/build/generated/runtime-config/kotlin/com/nuvio/app/core/network/SupabaseConfig.kt'
          trakt_config='composeApp/build/generated/runtime-config/kotlin/com/nuvio/app/features/trakt/TraktConfig.kt'
          simkl_config='composeApp/build/generated/runtime-config/kotlin/com/nuvio/app/features/simkl/SimklConfig.kt'

          grep -Eq 'const val URL = "[^"]+"' "${supabase_config}"
          grep -Eq 'const val ANON_KEY = "[^"]+"' "${supabase_config}"
          grep -Eq 'const val FALLBACK_URL = "[^"]+"' "${supabase_config}"
          grep -Eq 'const val CLIENT_ID = "[^"]+"' "${trakt_config}"
          grep -Eq 'const val CLIENT_SECRET = "[^"]+"' "${trakt_config}"
          grep -Eq 'const val CLIENT_ID = "[^"]+"' "${simkl_config}"

      - name: Verify ARM64 release APK
        id: apk
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          source_apk="androidApp/build/outputs/apk/full/release/NuvioDV-fullRelease-arm64-v8a.apk"
          published_apk="release-assets/NuvioDV-${EXPECTED_VERSION}-arm64-v8a.apk"
          [[ -f "${source_apk}" ]]
          mkdir -p release-assets
          cp "${source_apk}" "${published_apk}"

          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          aapt2="${ANDROID_HOME}/build-tools/${build_tools}/aapt2"
          apksigner="${ANDROID_HOME}/build-tools/${build_tools}/apksigner"
          badging="$(${aapt2} dump badging "${published_apk}")"
          grep -Fq "package: name='com.darkaxt.nuviodv' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION}'" <<< "${badging}"
          grep -Fq "application-label:'NuvioDV'" <<< "${badging}"

          mapfile -t mpv_entries < <(unzip -Z1 "${published_apk}" | grep -E '^lib/.*/libmpv\.so$')
          [[ "${#mpv_entries[@]}" -eq 1 ]]
          [[ "${mpv_entries[0]}" == 'lib/arm64-v8a/libmpv.so' ]]
          unzip -p "${published_apk}" 'lib/arm64-v8a/libmpv.so' > "${RUNNER_TEMP}/libmpv.so"
          readelf -h "${RUNNER_TEMP}/libmpv.so" > "${RUNNER_TEMP}/libmpv-header.txt"
          readelf -Ws "${RUNNER_TEMP}/libmpv.so" > "${RUNNER_TEMP}/libmpv-symbols.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "${RUNNER_TEMP}/libmpv-header.txt"
          grep -q 'dovi_parse_rpu' "${RUNNER_TEMP}/libmpv-symbols.txt"

          "${apksigner}" verify --verbose --print-certs "${published_apk}" | tee "${RUNNER_TEMP}/apksigner.txt"
          sha256="$(sha256sum "${published_apk}" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          signer_sha256="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: (.+)$/\1/p; s/^V2 Signer.*certificate SHA-256 digest: (.+)$/\1/p' "${RUNNER_TEMP}/apksigner.txt" | head -n 1 | tr '[:lower:]' '[:upper:]')"
          [[ -n "${signer_sha256}" ]]

          echo "path=${published_apk}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${published_apk}")" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "signer_sha256=${signer_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NuvioDV-${{ steps.release.outputs.version }}-arm64-v8a
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          SIGNER_SHA256: ${{ steps.apk.outputs.signer_sha256 }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Personal NuvioDV release for ARM64 Android devices.

          - Package: \`com.darkaxt.nuviodv\`
          - Version: \`${RELEASE_VERSION}\`
          - APK: \`${APK_NAME}\`
          - APK SHA-256: \`${APK_SHA256}\`
          - Signing certificate SHA-256: \`${SIGNER_SHA256}\`
          - Player: patched libmpv with libdovi and the independent libplacebo pink-screen correction
          - Playback details: optional live resolution, codec, dynamic range, and frame-rate row
          - Collections: native authenticated Trakt recommendations, watchlists, Up Next, Recently Aired, and calendar sources with website-compatible exports
          - Artwork: optional RatingPosterDB portraits with custom API-key support and the public Tier 0 fallback
          - Authentication: Nuvio account, Trakt, and Simkl runtime configuration restored

          This is an unofficial personal fork of NuvioMobile. Full Dolby Vision Profile 7 FEL decoding is not claimed.
          EOF
          gh release create "${RELEASE_TAG}" "${APK_PATH}" \
            --target "${SOURCE_SHA}" \
            --title "NuvioDV ${RELEASE_VERSION}" \
            --notes-file release-notes.md
